<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact us | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="contact"><header id="site-header"></header><main class="container section"><div class="section-head"><div><span class="eyebrow">We're listening</span><h1>Say hello. We're happy you're here.</h1><p>Questions, thoughts, a course idea? Send us a note.</p></div></div><form id="contact-form" class="card detail-outline" style="max-width:680px"><div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" maxlength="5000" required></textarea></div><p id="contact-feedback" class="feedback" role="status"></p><button type="submit">Send your note</button></form></main><footer id="site-footer"></footer></body></html>

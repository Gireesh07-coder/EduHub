<body data-page="login"><header id="site-header"></header><main class="container section"><section class="card auth-card"><span class="eyebrow">Good to see you again</span><h1>Welcome back.</h1><p>Pick up where you left off, or start something new.</p><form id="login-form"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><p id="login-feedback" class="feedback" role="status"></p><button class="button block" type="submit">Log in</button></form><p class="small-text" style="margin-top:1rem"><a href="/forgot-password.html">Forgot your password?</a></p><div class="divider">New around here?</div><a class="button secondary block" href="/register.html">Create a free account</a></section></main><footer id="site-footer"></footer></body></html>

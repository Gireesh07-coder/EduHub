<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="invoice"><header id="site-header"></header><main class="container section"><p id="invoice-feedback" class="feedback" role="status"></p><article class="card invoice"><div class="inline" style="justify-content:space-between"><div><span class="eyebrow">EduHub learning</span><h1>Payment receipt</h1></div><button id="print-invoice" class="button secondary no-print" type="button">Print receipt</button></div><div class="grid feature-grid" style="margin:2rem 0"><div><span class="muted small-text">Invoice</span><p id="invoice-number"></p></div><div><span class="muted small-text">Date</span><p id="invoice-date"></p></div><div><span class="muted small-text">Billed to</span><p id="invoice-name"></p><p id="invoice-email"></p></div></div><div class="table-wrap"><table><thead><tr><th>Course</th><th>Price</th></tr></thead><tbody id="invoice-lines"></tbody></table></div><p class="inline" style="justify-content:space-between;margin-top:1rem"><span>Subtotal</span><strong id="invoice-subtotal"></strong></p><p class="inline" style="justify-content:space-between"><span>Discount</span><strong id="invoice-discount"></strong></p><p class="inline" style="justify-content:space-between;font-size:1.2rem"><strong>Total</strong><strong id="invoice-total"></strong></p><p id="invoice-payment" class="small-text muted"></p><p class="small-text muted">This receipt confirms a simulated order only. No real payment was processed.</p></article></main><footer id="site-footer"></footer></body></html>

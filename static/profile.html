<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your profile | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="profile"><header id="site-header"></header><main class="container section"><span class="eyebrow">Your account</span><h1>Make yourself at home.</h1><div class="dashboard-grid"><nav class="card side-nav" aria-label="Account menu"><a href="/dashboard.html">Dashboard</a><a href="/orders.html">My courses</a><a href="/wishlist.html">Wishlist</a><a class="active" href="/profile.html">Profile</a></nav><div class="grid"><form id="profile-form" class="card detail-outline"><h2>Profile details</h2><div class="field"><label for="name">Name</label><input id="name" name="name" maxlength="100" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" readonly></div><div class="form-grid"><div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="5" max="100"></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="30"></div></div><p id="verified-status" class="small-text muted"></p><button id="verify-email-button" class="button secondary small" type="button">Verify email (demo)</button><p id="profile-feedback" class="feedback" role="status"></p><button type="submit">Save profile</button></form><form id="change-password-form" class="card detail-outline"><h2>Change password</h2><div class="field"><label for="current-password">Current password</label><input id="current-password" name="current_password" type="password" required></div><div class="field"><label for="new-password">New password</label><input id="new-password" name="new_password" type="password" minlength="8" maxlength="72" required></div><div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="72" required></div><p id="password-feedback" class="feedback" role="status"></p><button type="submit">Update password</button></form></div></div></main><footer id="site-footer"></footer></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="register"><header id="site-header"></header><main class="container section"><section class="card auth-card"><span class="eyebrow">A fresh start</span><h1>Make space to grow.</h1><p>Your next favorite skill is closer than you think.</p><form id="register-form"><div class="field"><label for="name">Your name</label><input id="name" name="name" maxlength="100" autocomplete="name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><span class="small-text muted">At least 8 characters</span></div><p id="register-feedback" class="feedback" role="status"></p><button class="button block" type="submit">Create account</button></form><p class="small-text" style="margin-top:1rem">By joining, you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p><div class="divider">Already a member?</div><a class="button secondary block" href="/login.html">Log in</a></section></main><footer id="site-footer"></footer></body></html>

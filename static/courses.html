<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course catalog | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="catalog"><header id="site-header"></header><main><section class="section container"><div class="section-head"><div><span class="eyebrow">The course library</span><h1>Find your next favorite subject.</h1><p>Learn practical skills with thoughtful teachers and a little room to explore.</p></div></div><div class="catalog-layout">
  <form id="catalog-filters" class="card filter-panel"><h3>Find a course</h3><div class="field"><label for="catalog-search">Search</label><input id="catalog-search" type="search" placeholder="Try Python or design…"></div><div class="field"><label for="category-filter">Category</label><select id="category-filter" name="category"><option value="">All categories</option></select></div><div class="field"><label for="level-filter">Level</label><select id="level-filter" name="level"><option value="">All levels</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="field"><label for="price-filter">Maximum price</label><select id="price-filter" name="max_price"><option value="">Any price</option><option value="50">Up to $50</option><option value="80">Up to $80</option><option value="100">Up to $100</option><option value="150">Up to $150</option></select></div><div class="field"><label for="sort-filter">Sort by</label><select id="sort-filter" name="sort"><option value="popular">Popular</option><option value="newest">Newest</option><option value="price">Price</option><option value="rating">Top rated</option></select></div><button class="button block" type="submit">Apply filters</button></form>
  <div><div class="catalog-toolbar"><p id="catalog-count" aria-live="polite">Browse courses</p><div class="inline"><button id="catalog-prev" class="button outline small" type="button">← Previous</button><button id="catalog-next" class="button outline small" type="button">Next →</button></div></div><p id="catalog-feedback" class="feedback" role="status"></p><div id="catalog-courses" class="grid courses"></div></div>
</div></section></main><footer id="site-footer"></footer></body></html>

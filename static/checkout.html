<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | EduHub</title><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages.css"><script defer src="/js/shared.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="checkout"><header id="site-header"></header><main class="container section"><span class="eyebrow">Secure demo checkout</span><h1>One last little step.</h1><div class="checkout-layout"><section class="card detail-outline"><h2>Payment method</h2><p>Mock checkout only — no payment provider is connected and no full payment details are collected.</p><form id="checkout-form"><div class="field"><label for="payment-method">Choose a method</label><select id="payment-method" name="payment_method" required><option value="card">Card (mock)</option><option value="upi">UPI (mock)</option><option value="paypal">PayPal (mock)</option></select></div><div class="field" id="last4-field"><label for="last4">Last 4 digits only</label><input id="last4" name="last4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="1234"></div><button class="button block" type="submit">Place demo order</button></form><p id="checkout-feedback" class="feedback" role="status"></p></section><aside class="card checkout-summary"><h2>Your order</h2><div id="checkout-items"></div><div class="divider"></div><form id="coupon-form"><div class="field"><label for="coupon-code">Coupon code</label><div class="inline"><input id="coupon-code" maxlength="40" placeholder="If you have one"><button class="button secondary" type="submit">Apply</button></div></div></form><p id="coupon-feedback" class="feedback" role="status"></p><div class="inline" style="justify-content:space-between"><span>Subtotal</span><strong id="checkout-subtotal"></strong></div><div class="inline" style="justify-content:space-between"><span>Discount</span><strong id="checkout-discount">—</strong></div><div class="inline" style="justify-content:space-between;margin-top:1rem"><strong>Total</strong><strong id="checkout-total"></strong></div></aside></div></main><footer id="site-footer"></footer></body></html>
